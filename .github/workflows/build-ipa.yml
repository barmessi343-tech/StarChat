
name: StarChat iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build StarChat IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS application
        run: |
          xcodebuild \
            -project StarChat.xcodeproj \
            -scheme StarChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StarChat.app Payload/
          zip -r StarChat.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StarChat-IPA
          path: StarChat.ipa
          retention-days: 7
